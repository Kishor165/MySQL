<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Glassmorphism Card</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Glowing Background Orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      animation: float 8s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 300px;
      height: 300px;
      background: #6366f1;
      top: 20%;
      left: 30%;
    }

    .orb-2 {
      width: 250px;
      height: 250px;
      background: #ec4899;
      bottom: 20%;
      right: 30%;
      animation-delay: -4s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -40px) scale(1.1); }
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      z-index: 1;
      width: 360px;
      padding: 32px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  box-shadow 0.4s ease, 
                  border-color 0.4s ease;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), 
                  0 0 30px rgba(99, 102, 241, 0.2);
    }

    /* Card Elements */
    .icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 16px rgba(99, 102, 241, 0.3);
    }

    .icon-box svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .card h3 {
      color: #f8fafc;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .card p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      width: 100%;
      padding: 14px 24px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }

    .btn:hover {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <!-- Ambient background glow -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <!-- Main Card -->
  <div class="card">
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <h3>Glassmorphism UI</h3>
    <p>A minimalist design with dynamic backdrop blurs, soft glows, and reactive motion.</p>
    <button class="btn">Explore Design</button>
  </div>

</body>
</html>
